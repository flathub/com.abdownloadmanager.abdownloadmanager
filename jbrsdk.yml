name: jbrsdk
buildsystem: simple
cleanup:
  - '*'
build-commands:
  - mkdir -p /app/lib/jbrsdk
  - tar xzf jbrsdk_jcef-*.tar.gz -C /app/lib/jbrsdk --strip-components=1
sources:
  - type: file
    url: https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-25.0.5.1-linux-x64-b635.102.tar.gz
    sha512: 6c84f979a63766be3c765d293dceddefca3b86856b6e70c2418a115bfd2b84c5ed8f471e6e31639f630d0aca66f1916e286658edc0f20a98e9815cadd6f5080a
    only-arches:
      - x86_64
    x-checker-data:
      <<: &jbrsdk-checker
        type: json
        url: https://api.github.com/repos/JetBrains/JetBrainsRuntime/releases
        tag-query: '[.[] | select(.prerelease | not) | select(.tag_name | test("^jbr-release-25[.][0-9.]+b[0-9.]+$"))]
          | max_by(.tag_name | capture("^jbr-release-(?<v>[0-9.]+)b(?<b>[0-9.]+)$")
          | [(.v, .b) | split(".") | map(tonumber)]) | .tag_name'
        timestamp-query: .[] | select(.tag_name == $tag) | .published_at
        version-query: $tag | sub("^jbr-release-"; "")
        url-query: |-
          .[] | select(.tag_name == $tag) | .body | [scan("https://cache-redirector[.]jetbrains[.]com/intellij-jbr/jbrsdk_jcef-[0-9.]+-linux-x64-b[0-9.]+[.]tar[.]gz")] | first
  - type: file
    url: https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-25.0.5.1-linux-aarch64-b635.102.tar.gz
    sha512: f59ede2d3ddbd56cc680729000a1152ec3d5dadfbc2f780bbbe692084639dfd1dffc5070ed47ef093823212da23d28d23b276eee8f9367cfa0510fadb58fbaf5
    only-arches:
      - aarch64
    x-checker-data:
      <<: *jbrsdk-checker
      url-query: |-
        .[] | select(.tag_name == $tag) | .body | [scan("https://cache-redirector[.]jetbrains[.]com/intellij-jbr/jbrsdk_jcef-[0-9.]+-linux-aarch64-b[0-9.]+[.]tar[.]gz")] | first
