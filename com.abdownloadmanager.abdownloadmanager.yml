app-id: com.abdownloadmanager.abdownloadmanager
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: com.abdownloadmanager.abdownloadmanager
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-424242-1
  - --persist=.abdm

modules:
  - fakepid.yml
  - jbrsdk.yml
  - name: abdm
    buildsystem: simple
    build-options:
      append-path: /app/lib/jbrsdk/bin
      strip: true
      env:
        JAVA_HOME: /app/lib/jbrsdk
    build-commands:
      - sed -i s/distributionUrl.*/distributionUrl=gradle-bin.zip/ gradle/wrapper/gradle-wrapper.properties
      - ./gradlew --offline --no-daemon --console=plain --init-script offline.gradle createReleaseDistributable
      - mv desktop/app/build/compose/binaries/main-release/app/ABDownloadManager ${FLATPAK_DEST}/ab-download-manager
      - install -Dm755 ${FLATPAK_ID}.sh ${FLATPAK_DEST}/bin/${FLATPAK_ID}
      - install -Dm644 desktop/app/icons/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 -t ${FLATPAK_DEST}/share/applications ${FLATPAK_ID}.desktop
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: git
        url: https://github.com/amir1376/ab-download-manager.git
        tag: v1.11.2
        commit: 14a947bf112c71a32d2f0d0089dcf928493feda8
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: file
        path: offline.gradle
      - type: file
        path: com.abdownloadmanager.abdownloadmanager.sh
      - type: file
        path: com.abdownloadmanager.abdownloadmanager.desktop
      - type: file
        path: com.abdownloadmanager.abdownloadmanager.metainfo.xml
      - gradle-sources.json
