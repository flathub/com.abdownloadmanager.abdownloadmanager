name: jbrsdk
buildsystem: simple
cleanup:
  - '*'
build-commands:
  - mkdir -p /app/lib/jbrsdk
  - tar xzf jbrsdk_jcef-*.tar.gz -C /app/lib/jbrsdk --strip-components=1
sources:
  - type: file
    url: https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-25.0.5.0.3-linux-x64-b700.17.tar.gz
    sha512: 873acb2d2f2dc80cf34e7105a8684dd0ba31de274aa0a794461ce2c16deef7fd8dc89b3fd02f913326f318744984a94a4bcbce8b1798d4169e3393638d6c2e64
    only-arches:
      - x86_64
    x-checker-data:
      <<: &jbrsdk-checker
        type: json
        url: https://api.github.com/repos/JetBrains/JetBrainsRuntime/releases
        tag-query: '[.[] | select(.prerelease | not) | select(.tag_name | test("^jbr-release-25[.][0-9.]+b[0-9.]+$"))]
          | max_by(.tag_name | capture("^jbr-release-(?<v>[0-9.]+)b(?<b>[0-9.]+)$")
          | [(.v, .b) | split(".") | map(tonumber)]) | .tag_name'
        timestamp-query: .[] | select(.tag_name == $tag) | .published_at
        version-query: $tag | sub("^jbr-release-"; "")
        url-query: |-
          .[] | select(.tag_name == $tag) | .body | [scan("https://cache-redirector[.]jetbrains[.]com/intellij-jbr/jbrsdk_jcef-[0-9.]+-linux-x64-b[0-9.]+[.]tar[.]gz")] | first
  - type: file
    url: https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-25.0.5.0.3-linux-aarch64-b700.17.tar.gz
    sha512: ed6376f9baca1e7d79252676bd0885fddc5c917206ff66cecadc1a6b2765de75b1ffeb6c02405ccaad52b870d54195e955899793b6b619dc533fafd1e238e6c3
    only-arches:
      - aarch64
    x-checker-data:
      <<: *jbrsdk-checker
      url-query: |-
        .[] | select(.tag_name == $tag) | .body | [scan("https://cache-redirector[.]jetbrains[.]com/intellij-jbr/jbrsdk_jcef-[0-9.]+-linux-aarch64-b[0-9.]+[.]tar[.]gz")] | first
